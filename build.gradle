plugins {
    id 'signing'
    id 'java-library'
    id 'maven-publish'
    id 'io.gitee.pkmer.sonatype-central-publisher' version '1.1.0'
}

group = 'io.github.osipaandr'
version = '1.0.0'

repositories {
    mavenCentral()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'ru-numbers-by-words'
                description = 'Library for converting numbers to words in Russian'
                url = 'https://github.com/osipaandr/ru-numbers-by-words'
                inceptionYear = '2023'

                licenses {
                    license {
                        name = 'The Unlicense'
                        url = 'https://unlicense.org/'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'osipaandr'
                        name = 'Andrey Osipenko'
                        email = 'osipaandr@gmail.com'
                    }
                }
                scm {
                    url = 'https://github.com/osipaandr/ru-numbers-by-words'
                    connection = 'scm:https://github.com/osipaandr/ru-numbers-by-words'
                    developerConnection = 'scm:git:ssh://github.com:osipaandr/ru-numbers-by-words.git'
                }
            }

        }
    }

    repositories {
        maven {
            name = 'centralPortalStaging'
            url = layout.buildDirectory.dir('repos/bundles')
        }
    }
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

signing {
    sign publishing.publications.mavenJava
}

pkmerBoot {
    sonatypeMavenCentral {
        stagingRepository = layout.buildDirectory.dir("repos/bundles")
        username = project.findProperty("mavenCentralUsername") ?: System.getenv("MAVEN_USERNAME")
        password = project.findProperty("mavenCentralPassword") ?: System.getenv("MAVEN_PASSWORD")
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

task printCredentials {
    doLast {
        println "Username: " + (project.findProperty("mavenCentralUsername") ?: "не определено")
        println "Password: " + (project.findProperty("mavenCentralPassword") ?: "не определено")
    }
}
